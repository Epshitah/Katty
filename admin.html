<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Epshitah Stories — My Page</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #fff8fb;
  color: #241a20;
}

header {
  background: linear-gradient(135deg, #7b174d, #b62d72);
  color: white;
  padding: 25px 15px;
  text-align: center;
}

header h1 {
  margin: 0;
  font-size: 30px;
}

header p {
  margin: 8px 0 0;
}

main {
  max-width: 850px;
  margin: auto;
  padding: 20px 15px 50px;
}

.box {
  background: white;
  padding: 22px;
  margin-bottom: 20px;
  border-radius: 18px;
  box-shadow: 0 5px 20px #0002;
}

h2 {
  color: #7b174d;
}

input,
textarea {
  width: 100%;
  padding: 12px;
  margin: 8px 0;
  border: 1px solid #ddd;
  border-radius: 10px;
  font-size: 16px;
  font-family: Arial, sans-serif;
}

textarea {
  min-height: 180px;
  resize: vertical;
}

button {
  border: 0;
  border-radius: 10px;
  padding: 12px 18px;
  background: #8d1f59;
  color: white;
  font-size: 16px;
  font-weight: bold;
  margin-top: 8px;
  cursor: pointer;
}

.logout {
  background: #555;
}

.delete {
  background: #b21f3b;
}

.message {
  margin: 10px 0;
  font-weight: bold;
}

.story-card {
  border: 1px solid #eee;
  border-radius: 14px;
  padding: 15px;
  margin-top: 12px;
  background: #fffafd;
}

.tag {
  display: inline-block;
  background: #f7dce9;
  color: #7b174d;
  padding: 6px 10px;
  border-radius: 20px;
  font-size: 13px;
  font-weight: bold;
}

.story-content {
  white-space: pre-wrap;
  line-height: 1.7;
  margin-top: 15px;
}

.note {
  background: #fff3f8;
  padding: 12px;
  border-radius: 10px;
  line-height: 1.5;
}

.empty {
  text-align: center;
  color: #777;
  padding: 20px;
}
</style>
</head>

<body>

<header>

<h1>Epshitah Stories</h1>

<p>My Private Author Page</p>

<button class="logout" onclick="adminLogout()">
Log Out
</button>

</header>

<main>

<section class="box">

<h2>Welcome, Molebatsi ❤️</h2>

<p>
This is your private author dashboard.
</p>

<div class="note">
<strong>Permanent storage:</strong><br>
Stories saved here are stored in your database and can be loaded again later.
</div>

</section>

<section class="box">

<h2>➕ Add a Story</h2>

<input
id="storyTitle"
type="text"
placeholder="Story title">

<input
id="storyCategory"
type="text"
placeholder="Category e.g. Love, Pain, Family">

<textarea
id="storyDescription"
placeholder="Short description of the story"></textarea>

<textarea
id="storyContent"
placeholder="Write your story here..."></textarea>

<button onclick="saveStory()">
Save Story Permanently
</button>

<div id="storyMessage" class="message"></div>

</section>

<section class="box">

<h2>📚 My Stories</h2>

<div id="stories">

<div class="empty">
Loading your saved stories...
</div>

</div>

</section>

</main>

<script>

async function checkAdmin() {

  try {

    const response = await fetch("/api/admin/me", {
      credentials: "same-origin"
    });

    const data = await response.json();

    if (!data.loggedIn) {

      window.location.href = "/admin";

      return false;

    }

    return true;

  } catch (error) {

    console.error(error);

    return false;

  }

}


async function adminLogout() {

  try {

    await fetch("/api/admin/logout", {
      method: "POST",
      credentials: "same-origin"
    });

  } finally {

    window.location.href = "/admin";

  }

}


async function saveStory() {

  const title =
    document.getElementById("storyTitle").value.trim();

  const category =
    document.getElementById("storyCategory").value.trim();

  const description =
    document.getElementById("storyDescription").value.trim();

  const content =
    document.getElementById("storyContent").value.trim();

  const message =
    document.getElementById("storyMessage");


  if (!title) {

    message.textContent =
      "Please enter a story title.";

    return;

  }


  if (!content) {

    message.textContent =
      "Please enter your story.";

    return;

  }


  message.textContent =
    "Saving permanently...";


  try {

    const response = await fetch("/api/admin/stories", {

      method: "POST",

      credentials: "same-origin",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        title: title,
        category: category,
        description: description,
        content: content
      })

    });


    const data = await response.json();


    if (!response.ok) {

      message.textContent =
        data.message ||
        "The story could not be saved.";

      return;

    }


    message.textContent =
      "✅ Story saved permanently!";


    document.getElementById("storyTitle").value = "";

    document.getElementById("storyCategory").value = "";

    document.getElementById("storyDescription").value = "";

    document.getElementById("storyContent").value = "";


    loadStories();


  } catch (error) {

    console.error(error);

    message.textContent =
      "Could not connect to the server.";

  }

}


async function loadStories() {

  const container =
    document.getElementById("stories");


  try {

    const response =
      await fetch("/api/stories");


    if (!response.ok) {

      throw new Error("Could not load stories.");

    }


    const stories =
      await response.json();


    if (!stories.length) {

      container.innerHTML = `
        <div class="empty">
          You have not saved any stories yet.
        </div>
      `;

      return;

    }


    container.innerHTML = "";


    stories.forEach(function(story) {

      const card =
        document.createElement("div");

      card.className =
        "story-card";


      const tag =
        document.createElement("span");

      tag.className =
        "tag";

      tag.textContent =
        story.category || "STORY";


      const title =
        document.createElement("h3");

      title.textContent =
        story.title;


      const description =
        document.createElement("p");

      description.textContent =
        story.description || "";


      const content =
        document.createElement("div");

      content.className =
        "story-content";

      content.textContent =
        story.content;


      const deleteButton =
        document.createElement("button");

      deleteButton.className =
        "delete";

      deleteButton.textContent =
        "Delete Story";


      deleteButton.onclick =
        function() {

          deleteStory(story.id);

        };


      card.appendChild(tag);

      card.appendChild(title);

      card.appendChild(description);

      card.appendChild(content);

      card.appendChild(deleteButton);


      container.appendChild(card);

    });


  } catch (error) {

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        Could not load your saved stories.
      </div>
    `;

  }

}


async function deleteStory(id) {

  const confirmed =
    confirm(
      "Are you sure you want to permanently delete this story?"
    );


  if (!confirmed) {

    return;

  }


  try {

    const response =
      await fetch(
        "/api/admin/stories/" + id,
        {
          method: "DELETE",
          credentials: "same-origin"
        }
      );


    const data =
      await response.json();


    if (!response.ok) {

      alert(
        data.message ||
        "Could not delete the story."
      );

      return;

    }


    loadStories();


  } catch (error) {

    console.error(error);

    alert(
      "Could not connect to the server."
    );

  }

}


async function start() {

  const loggedIn =
    await checkAdmin();


  if (loggedIn) {

    loadStories();

  }

}


start();

</script>

</body>
</html>
