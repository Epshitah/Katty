<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Author Dashboard — Epshitah Stories</title><link rel="stylesheet" href="/style.css"></head><body><nav class="nav"><a class="brand" href="/">Epshitah Stories</a><div class="navlinks"><a href="/">View site</a><button id="logout">Log out</button></div></nav><main class="section"><div id="blocked" class="card" style="padding:25px;display:none"><h2>Admin access required</h2><p class="muted">Please log in with the administrator account.</p><a class="btn dark" href="/">Go to login</a></div><div id="studio" style="display:none"><h1>Author Dashboard</h1><p class="muted">Manage your stories and videos from one place.</p><div id="stats" class="grid" style="margin:25px 0"></div><div class="toolbar"><button class="btn dark" id="newStory">+ Add Story</button><button class="btn dark" id="newVideo">+ Add Video</button></div><section><h2>My Stories</h2><div id="storyList" class="grid"></div></section><section style="margin-top:40px"><h2>Videos</h2><div id="videoList" class="grid"></div></section></div></main><div id="editor" class="modal"><div class="modal-box"><button class="close" onclick="closeEditor()">Close</button><h2 id="editorTitle">Add Story</h2><form id="storyForm" class="form"><div class="row"><input class="input" id="title" placeholder="Story title" required><input class="input" id="genre" placeholder="Genre" value="Romance"></div><input class="input" id="cover" placeholder="Cover image URL (optional)"><textarea class="textarea" id="description" rows="3" placeholder="Short description"></textarea><textarea class="textarea" id="content" rows="14" placeholder="Write your story here..." required></textarea><label><input type="checkbox" id="published"> Published</label><button class="btn dark">Save Story</button></form></div></div><div id="videoEditor" class="modal"><div class="modal-box"><button class="close" onclick="closeVideoEditor()">Close</button><h2>Video</h2><form id="videoForm" class="form"><input class="input" id="vtitle" placeholder="Video title" required><input class="input" id="vurl" placeholder="YouTube or video URL" required><input class="input" id="vthumb" placeholder="Thumbnail URL (optional)"><textarea class="textarea" id="vdesc" rows="3" placeholder="Description"></textarea><button class="btn dark">Save Video</button></form></div></div><div id="toast" class="toast"></div><script>let stories=[],videos=[],editing=null,editingVideo=null;const $=s=>document.querySelector(s);function toast(x){$('#toast').textContent=x;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2500)}async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Request failed');return d}async function init(){const m=await api('/api/me');if(!m.user||!m.user.isAdmin){$('#blocked').style.display='block';return}$('#studio').style.display='block';await refresh()}async function refresh(){const [s,v,st]=await Promise.all([api('/api/admin/stories'),api('/api/admin/videos'),api('/api/admin/stats')]);stories=s.stories;videos=v.videos;$('#stats').innerHTML=[['Total Stories',st.total],['Published',st.published],['Drafts',st.drafts],['Videos',st.videos],['Readers',st.users]].map(x=>`<div class="card" style="padding:20px"><div class="muted">${x[0]}</div><div style="font-size:2rem;font-weight:900">${x[1]}</div></div>`).join('');$('#storyList').innerHTML=stories.length?stories.map(s=>`<article class="card"><div class="card-body"><span class="tag">${esc(s.genre)} · ${s.published?'Published':'Draft'}</span><h3>${esc(s.title)}</h3><p class="muted">${esc(s.description||'')}</p><div class="actions"><button class="btn dark" onclick="editStory(${s.id})">Edit</button><button class="btn" onclick="toggleStory(${s.id})">${s.published?'Unpublish':'Publish'}</button><button class="btn" onclick="deleteStory(${s.id})">Delete</button></div></div></article>`).join(''):'<div class="empty">You have not added any stories yet.</div>';$('#videoList').innerHTML=videos.length?videos.map(v=>`<article class="card"><div class="card-body"><h3>${esc(v.title)}</h3><p class="muted">${esc(v.description||'')}</p><div class="actions"><button class="btn dark" onclick="editVideo(${v.id})">Edit</button><button class="btn" onclick="deleteVideo(${v.id})">Delete</button></div></div></article>`).join(''):'<div class="empty">No videos yet.</div>'}function openEditor(s=null){editing=s?.id||null;$('#editorTitle').textContent=s?'Edit Story':'Add Story';$('#title').value=s?.title||'';$('#genre').value=s?.genre||'Other';$('#cover').value=s?.cover||'';$('#description').value=s?.description||'';$('#content').value=s?.content||'';$('#published').checked=!!s?.published;$('#editor').classList.add('show')}function closeEditor(){$('#editor').classList.remove('show')}$('#newStory').onclick=()=>openEditor();$('#storyForm').onsubmit=async e=>{e.preventDefault();const body={title:$('#title').value,genre:$('#genre').value,cover:$('#cover').value,description:$('#description').value,content:$('#content').value,published:$('#published').checked};try{await api(editing?'/api/admin/stories/'+editing:'/api/admin/stories',{method:editing?'PUT':'POST',body:JSON.stringify(body)});closeEditor();await refresh();toast('Story saved.')}catch(e){toast(e.message)}};function editStory(id){openEditor(stories.find(x=>x.id===id))}async function toggleStory(id){try{await api('/api/admin/stories/'+id+'/publish',{method:'PATCH'});await refresh();toast('Publication status changed.')}catch(e){toast(e.message)}}async function deleteStory(id){if(!confirm('Delete this story permanently?'))return;try{await api('/api/admin/stories/'+id,{method:'DELETE'});await refresh();toast('Story deleted.')}catch(e){toast(e.message)}}function openVideoEditor(v=null){editingVideo=v?.id||null;$('#vtitle').value=v?.title||'';$('#vurl').value=v?.url||'';$('#vthumb').value=v?.thumbnail||'';$('#vdesc').value=v?.description||'';$('#videoEditor').classList.add('show')}function closeVideoEditor(){$('#videoEditor').classList.remove('show')}$('#newVideo').onclick=()=>openVideoEditor();$('#videoForm').onsubmit=async e=>{e.preventDefault();const body={title:$('#vtitle').value,url:$('#vurl').value,thumbnail:$('#vthumb').value,description:$('#vdesc').value};try{await api(editingVideo?'/api/admin/videos/'+editingVideo:'/api/admin/videos',{method:editingVideo?'PUT':'POST',body:JSON.stringify(body)});closeVideoEditor();await refresh();toast('Video saved.')}catch(e){toast(e.message)}};function editVideo(id){openVideoEditor(videos.find(x=>x.id===id))}async function deleteVideo(id){if(!confirm('Delete this video?'))return;try{await api('/api/admin/videos/'+id,{method:'DELETE'});await refresh();toast('Video deleted.')}catch(e){toast(e.message)}}$('#logout').onclick=async()=>{await api('/api/logout',{method:'POST'});location.href='/'}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}init().catch(e=>toast(e.message));</script></body></html>
